<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }}</title>
  <meta name="author" content="John So">
  <meta name="description" content="{{ page.description | default: 'John So' }}">
  <link rel="icon" href="/media/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="/css/site.css">
  <script>
    // Theme follows the headshot; the choice is remembered across pages.
    const themes = ['green', 'sky', 'night'];
    let theme;
    try { theme = localStorage.getItem('theme'); } catch (e) {}
    if (!themes.includes(theme)) theme = themes[0];
    document.documentElement.dataset.theme = theme;

    function nextTheme() {
      theme = themes[(themes.indexOf(theme) + 1) % themes.length];
      document.documentElement.dataset.theme = theme;
      try { localStorage.setItem('theme', theme); } catch (e) {}
    }
  </script>
</head>
<body>
  <div class="outer-container">
    <div class="flex-container">
      {{ content }}
    </div>
  </div>
</body>
</html>
