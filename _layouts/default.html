<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }}</title>
  <meta name="author" content="John So">
  <meta name="description" content="{{ page.description | default: 'John So' | escape }}">
  <link rel="icon" href="/media/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="/css/site.css">
  <script>
    // Theme follows the headshot; the choice is remembered across pages.
    const themes = ['green', 'sky'];
    let theme, sketch;
    try {
      theme = localStorage.getItem('theme');
      sketch = localStorage.getItem('sketch') === '1';
    } catch (e) {}
    if (!themes.includes(theme)) theme = themes[0];
    document.documentElement.dataset.theme = theme;
    document.documentElement.toggleAttribute('data-sketch', !!sketch);

    function nextTheme() {
      theme = themes[(themes.indexOf(theme) + 1) % themes.length];
      document.documentElement.dataset.theme = theme;
      try { localStorage.setItem('theme', theme); } catch (e) {}
    }

    // Easter egg: handwriting font, painted headshots, sketched project videos.
    function toggleSketch() {
      sketch = !sketch;
      document.documentElement.toggleAttribute('data-sketch', sketch);
      try { localStorage.setItem('sketch', sketch ? '1' : '0'); } catch (e) {}
      applySketchVideos();
    }

    // Videos can't be swapped with CSS alone without downloading both, so swap src.
    function applySketchVideos() {
      document.querySelectorAll('video[data-sketch-src]').forEach(function (v) {
        if (!v.dataset.photoSrc) v.dataset.photoSrc = v.getAttribute('src');
        const want = sketch ? v.dataset.sketchSrc : v.dataset.photoSrc;
        if (v.getAttribute('src') !== want) {
          v.src = want;
          v.play().catch(function () {});
        }
      });
    }
    document.addEventListener('DOMContentLoaded', function () {
      applySketchVideos();
      // every page title toggles sketch mode
      document.querySelectorAll('h1').forEach(function (h) {
        h.classList.add('sketch-toggle');
        h.addEventListener('click', toggleSketch);
      });
    });
  </script>
</head>
<body>
  <div class="outer-container">
    <div class="flex-container">
      {{ content }}
    </div>
  </div>
</body>
</html>
